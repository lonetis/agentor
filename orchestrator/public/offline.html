<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <title>Agentor: unreachable</title>
  <!--
    Served by the service worker (public/sw.js) when a page navigation fails or
    the reverse proxy answers 502/503/504. Fully self-contained: no request may
    leave this file, because the server it would load from is unreachable.
  -->
  <script>
    // Follow the dashboard's colour mode (@nuxtjs/color-mode, default dark).
    try {
      const preference = localStorage.getItem('nuxt-color-mode') ?? 'dark';
      if (preference === 'light' || preference === 'dark') document.documentElement.dataset.theme = preference;
    } catch (err) {
      // Storage blocked: follow the OS colour scheme.
    }
  </script>
  <style>
    :root {
      --bg: #f9fafb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #030712;
        --card: #111827;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --border: #1f2937;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #030712;
      --card: #111827;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #1f2937;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 400px;
      padding: 32px 24px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      text-align: center;
    }
    img { display: block; margin: 0 auto 16px; }
    h1 { margin: 0 0 8px; font-size: 1.25rem; font-weight: 600; }
    p { margin: 0; color: var(--muted); font-size: 0.875rem; }
    button {
      margin-top: 24px;
      min-height: 44px;
      padding: 0 24px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      font: inherit;
      font-weight: 500;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:hover { background: var(--accent-hover); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #status { margin-top: 16px; min-height: 1.5em; font-size: 0.75rem; }
  </style>
</head>

    <h1>Agentor is unreachable</h1>
    <p>You are offline, or the server is restarting. This page reconnects automatically.</p>
    <button id="retry" type="button">Retry</button>
    <p id="status" aria-live="polite"></p>
  </main>
  <script>
    (() => {
      const FAST_MS = 5_000;
      const SLOW_MS = 30_000;
      // Reloads from this page within this window count as consecutive: the
      // health check passed, but the page came back here again.
      const CONSECUTIVE_WINDOW_MS = 60_000;
      const MAX_FAST_RELOADS = 3;
      const STORAGE_KEY = 'agentor-offline-reloads';
      const status = document.getElementById('status');

      function readReloads() {
        try {
          const saved = JSON.parse(sessionStorage.getItem(STORAGE_KEY) ?? 'null');
          if (saved && Date.now() - saved.at < CONSECUTIVE_WINDOW_MS) return saved.count;
        } catch (err) {
          console.warn('[offline] reload counter unavailable', err);
        }
        return 0;
      }

      const reloads = readReloads();
      const interval = reloads >= MAX_FAST_RELOADS ? SLOW_MS : FAST_MS;
      let reloading = false;

      function reconnect() {
        if (reloading) return;
        reloading = true;
        try {
          sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ count: reloads + 1, at: Date.now() }));
        } catch (err) {
          console.warn('[offline] reload counter unavailable', err);
        }
        status.textContent = 'Connection restored. Reloading…';
        reloadApp();
      }

      // Opened directly, this page would just reload itself: go to the dashboard.
      function reloadApp() {
        if (location.pathname === '/offline.html') location.replace('/');
        else location.reload();
      }

      async function check() {
        try {
          const res = await fetch('/api/health', { cache: 'no-store' });
          if (res.ok) {
            reconnect();
            return;
          }
        } catch (err) {
          // Still unreachable: try again after the interval.
        }
        scheduleCheck();
      }

      function scheduleCheck() {
        status.textContent = `Checking again in ${interval / 1000} s.`;
        setTimeout(check, interval);
      }

      document.getElementById('retry').addEventListener('click', reloadApp);
      window.addEventListener('online', reconnect);
      scheduleCheck();
    })();
  </script>
